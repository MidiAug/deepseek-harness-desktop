[package]
name = "deepseek-harness-desktop"
version = "0.1.0"
description = "Trusted desktop host for DeepSeek Harness"
authors = ["deepseek-harness-desktop"]
edition = "2021"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
